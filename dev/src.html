<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>国旗から</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-title" content="国旗から">
<style>
:root{
  --bg1:#0b1a33;--bg2:#13284d;--ink:#1f2937;--sub:#6b7280;--card:#ffffff;
  --accent:#ff7a59;--accent2:#ffb347;--good:#22a06b;--bad:#e5484d;--gold:#f2c230;
  --safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  background:radial-gradient(ellipse at 50% 40%,var(--bg2),var(--bg1) 70%);color:#fff;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
ruby rt{font-size:.5em;font-weight:normal;opacity:.85}
button{font-family:inherit;border:0;cursor:pointer;color:inherit}
.hidden{display:none!important}
body.locating #bar,body.locating #hint{display:none}

/* header */
#top{position:fixed;left:0;right:0;top:0;padding:calc(var(--safeT) + 14px) 20px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
#logo{font-size:28px;font-weight:800;letter-spacing:.04em;text-shadow:0 2px 10px rgba(0,0,0,.4)}
#logo small{display:block;font-size:12px;font-weight:600;opacity:.7;letter-spacing:.1em}
#score{background:rgba(255,255,255,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:16px;padding:10px 16px;text-align:right;font-size:14px;line-height:1.5}
#score b{font-size:26px}
#score .m{color:var(--gold);font-size:13px}

/* globe */
#stage{position:fixed;inset:0;touch-action:none}
#globe{width:100%;height:100%;display:block;touch-action:none}
#hint{position:fixed;left:0;right:0;bottom:calc(var(--safeB) + 118px);text-align:center;font-size:15px;opacity:.75;pointer-events:none;transition:opacity .6s}

/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;padding:0 20px calc(var(--safeB) + 18px);display:flex;gap:14px;justify-content:center;align-items:flex-end;z-index:5}
.btn{background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:20px;padding:14px 22px;font-size:17px;font-weight:700;min-width:96px}
.btn.big{background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:22px;padding:18px 40px;box-shadow:0 8px 24px rgba(255,122,89,.45)}
.btn:active{transform:scale(.96)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(5,12,28,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:calc(var(--safeT) + 16px) 16px calc(var(--safeB) + 16px)}
.panel{background:var(--card);color:var(--ink);border-radius:28px;width:100%;max-width:600px;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.close{position:sticky;top:12px;float:right;margin:12px 12px 0 0;width:44px;height:44px;border-radius:22px;background:#f1f3f6;color:var(--ink);font-size:24px;line-height:44px;z-index:2}
.pbody{padding:24px 26px 28px}

/* country card */
.cflag{display:block;width:72%;max-width:340px;margin:8px auto 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);border:1px solid #e5e7eb}
.cname{display:flex;align-items:center;justify-content:center;gap:12px;font-size:34px;font-weight:800;margin-bottom:2px}
.coff{text-align:center;color:var(--sub);font-size:15px;margin-bottom:12px}
.spk{width:44px;height:44px;border-radius:22px;background:#eef2ff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.spk svg{width:22px;height:22px}
.crow{display:flex;gap:16px;align-items:center;margin:6px 0 14px}
.mini{width:120px;height:120px;flex:none}
.lv{flex:1;background:#f7f8fa;border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.7}
.lv .name{font-size:20px;font-weight:800}
.dots{display:inline-flex;gap:5px;vertical-align:middle;margin-left:6px}
.dots i{width:12px;height:12px;border-radius:6px;background:#e5e7eb;display:block}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:#f7f8fa;border-radius:14px;padding:10px 14px}
.fact .k{font-size:13px;color:var(--sub)}
.fact .v{font-size:19px;font-weight:700;line-height:1.5}
.fact .r{font-size:13px;color:var(--sub);line-height:1.5}
.fact.w{grid-column:1/-1}
.fact.w .v{font-size:17px;font-weight:600}
.src{margin-top:14px;font-size:12px;color:var(--sub);line-height:1.6}
.hello{display:flex;align-items:center;gap:10px}

/* quiz */
#quiz{position:fixed;inset:0;z-index:15;background:linear-gradient(180deg,#fff8ef,#ffeede);color:var(--ink);display:flex;flex-direction:column;padding:calc(var(--safeT) + 14px) 20px calc(var(--safeB) + 20px)}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:16px;color:var(--sub)}
.qbar{flex:1;height:10px;background:#f1e3d3;border-radius:5px;margin:0 14px;overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:5px;transition:width .3s}
.qx{width:44px;height:44px;border-radius:22px;background:#fff;font-size:22px;color:var(--ink)}
.qmain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.qprompt{font-size:26px;font-weight:800;line-height:1.6}
.qflag{width:min(70vw,420px);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);border:1px solid #eee}
.qname{font-size:44px;font-weight:800;display:flex;align-items:center;gap:12px}
.mic{width:130px;height:130px;border-radius:65px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 30px rgba(255,122,89,.5);display:flex;align-items:center;justify-content:center;color:#fff}
.mic svg{width:58px;height:58px}
.mic.on{animation:breathe 1s ease-in-out infinite;background:linear-gradient(135deg,#e5484d,#ff7a59)}
@keyframes breathe{50%{transform:scale(1.08);box-shadow:0 10px 50px rgba(229,72,77,.6)}}
.qstatus{min-height:64px;font-size:20px;line-height:1.6}
.qsub{display:flex;gap:12px}
.qsub button{background:#fff;color:var(--ink);border-radius:16px;padding:12px 20px;font-size:17px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(92vw,620px)}
.choice{background:#fff;color:var(--ink);border-radius:18px;padding:18px 10px;font-size:24px;font-weight:800;box-shadow:0 3px 10px rgba(0,0,0,.08);min-height:84px}
.choice img{width:100%;border-radius:8px;border:1px solid #eee;display:block}
.choice.ok{background:#dcfce7;outline:4px solid var(--good)}
.choice.ng{background:#fee2e2;outline:4px solid var(--bad)}
.judge{font-size:40px;font-weight:900}
.judge.ok{color:var(--good)} .judge.ng{color:var(--bad)}

/* locate banner */
#banner{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--safeT) + 14px);z-index:12;background:#fff;color:var(--ink);border-radius:22px;padding:12px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:94vw}
#banner img{height:56px;border-radius:6px;border:1px solid #eee}
#banner .t{font-size:20px;font-weight:800;line-height:1.5}
#banner button{background:#f1f3f6;border-radius:14px;padding:10px 14px;font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap}

/* zukan */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:#f7f8fa;border-radius:16px;padding:10px;text-align:center;color:var(--ink)}
.tile img{width:100%;border-radius:6px;border:1px solid #e5e7eb;display:block;margin-bottom:6px}
.tile b{font-size:17px}
.h2{font-size:24px;font-weight:800;margin:0 0 6px}
.note{font-size:14px;color:var(--sub);line-height:1.7;margin:4px 0 14px}
.sec{font-size:15px;font-weight:800;margin:18px 0 8px;color:var(--ink)}

.tabs{display:flex;width:100%;margin:4px 0 6px}.tabs button{flex:1;padding:10px 4px;font-size:15px}
.seg.wrap{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 12px}
.sec .cnt{font-size:13px;font-weight:600;color:var(--sub);margin-left:8px}
.tile .cap{font-size:13px;color:var(--sub);margin:2px 0}
.tile div{font-size:13px}
.rank{display:flex;flex-direction:column;gap:6px}
.rrow{display:flex;align-items:center;gap:10px;background:#f7f8fa;border-radius:14px;padding:8px 12px;color:var(--ink);text-align:left}
.rrow .no{width:28px;font-size:18px;font-weight:800;color:var(--sub);text-align:center;flex:none}
.rrow img{height:30px;border-radius:4px;border:1px solid #e5e7eb;flex:none}
.rrow .rn{flex:1;min-width:0}.rrow .rn b{font-size:16px}
.rrow .bar{display:block;height:8px;background:#e5e7eb;border-radius:4px;margin-top:4px;overflow:hidden}.rrow .bar i{display:block;height:100%;border-radius:4px}
.rrow .rv{font-size:14px;font-weight:700;white-space:nowrap;text-align:right;min-width:110px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px}
.mode{background:#f7f8fa;color:var(--ink);border-radius:18px;padding:14px 16px;text-align:left;border:3px solid transparent;display:flex;flex-direction:column;gap:4px}
.mode b{font-size:20px}.mode span{font-size:13px;color:var(--sub);line-height:1.6}
.mode.on{border-color:var(--accent);background:#fff4ef}
.start{display:block;width:100%;margin-top:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:22px;font-weight:800;border-radius:18px;padding:16px}
#quiz{touch-action:manipulation}
.speed{cursor:pointer}
.sans{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.veil{font-size:22px;color:var(--sub);background:#fff;border-radius:18px;padding:18px 34px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.scap{font-size:22px;color:var(--sub)}
.shint{min-height:28px;font-size:16px;color:var(--sub)}
.rbadge{text-align:center;font-size:14px;color:var(--sub);margin:2px 0 6px}.rbadge span{display:inline-block;background:#eef2ff;color:#4f46e5;font-weight:800;border-radius:8px;padding:2px 8px;margin-right:6px}
.src a{color:inherit}
#score .m2{font-size:13px;opacity:.85}
.pron{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 10px;margin:2px 0 8px;font-size:16px}
.pron .pi{display:inline-flex;align-items:center;gap:6px;background:#f7f8fa;border-radius:12px;padding:4px 6px 4px 10px}
.pron .pl{font-size:12px;color:var(--sub)}
.pron .spk{width:34px;height:34px;border-radius:17px}.pron .spk svg{width:17px;height:17px}
.more{margin-top:16px;background:linear-gradient(135deg,#fff4ef,#fff9ec);border:2px solid #ffd2c2;border-radius:18px;padding:14px 16px}
.more .mt{font-size:17px;font-weight:800;margin-bottom:4px}
.more .md{font-size:14px;line-height:1.8;color:#4b5563}
.mbtn{display:inline-block;margin-top:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;font-size:16px;border-radius:14px;padding:10px 16px;text-decoration:none}
/* 国カードを開いている間：地球儀が見えるように、カードを下（縦）／右（横）に寄せる */
body.cardmode #modal{background:rgba(5,12,28,.18);pointer-events:none;align-items:flex-end;padding:0 12px}
body.cardmode #modal .panel{pointer-events:auto;max-height:62vh;max-width:720px;border-radius:28px 28px 0 0;padding-bottom:var(--safeB)}
body.cardmode #bar,body.cardmode #hint{display:none}
@media (orientation:landscape){
  body.cardmode #modal{justify-content:flex-end;align-items:stretch;padding:calc(var(--safeT) + 10px) 0 calc(var(--safeB) + 10px)}
  body.cardmode #modal .panel{max-height:none;height:100%;width:min(560px,52vw);border-radius:28px 0 0 28px}
}
/* settings */
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eef0f3;font-size:17px;gap:10px}
.seg{display:inline-flex;background:#f1f3f6;border-radius:12px;padding:3px}
.seg button{padding:8px 14px;border-radius:10px;font-size:15px;font-weight:700;color:var(--sub);background:none}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.lvrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.lvrow img{height:28px;border-radius:4px;border:1px solid #e5e7eb}
.lvrow .n{flex:1;font-size:16px}
.small{background:#f1f3f6;color:var(--ink);border-radius:12px;padding:10px 14px;font-size:15px;font-weight:700}
.testout{background:#f7f8fa;border-radius:12px;padding:10px 14px;margin-top:8px;font-size:15px;line-height:1.7;min-height:44px;color:var(--ink)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--safeB) + 110px);transform:translateX(-50%) translateY(20px);background:rgba(17,24,39,.92);color:#fff;padding:14px 22px;border-radius:18px;font-size:17px;opacity:0;transition:.3s;z-index:30;pointer-events:none;text-align:center;max-width:90vw;line-height:1.6}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="stage"><canvas id="globe"></canvas></div>
<div id="top">
  <div id="logo"><span class="rb">{国旗|こっき}から</span></div>
  <div id="score"></div>
</div>
<div id="hint" class="rb">ゆびで まわしてみよう・{国|くに}をタップすると カードが ひらくよ</div>
<div id="bar">
  <button class="btn rb" data-act="zukan">{図鑑|ずかん}</button>
  <button class="btn big" data-act="study">スタート</button>
  <button class="btn rb" data-act="settings">{設定|せってい}</button>
</div>
<div id="banner" class="hidden"></div>
<div id="quiz" class="hidden"></div>
<div id="modal" class="hidden"><div class="panel"><button class="close" data-act="close">×</button><div class="pbody"></div></div></div>
<div id="toast"></div>

<script>/*__LIBS__*/</script>
<script>const WORLD50=/*__WORLD50__*/;const WORLD110=/*__WORLD110__*/;const FLAGS=/*__FLAGS__*/;</script>
<script>
"use strict";
// ---------- helpers ----------
const $=s=>document.querySelector(s);
const rb=s=>String(s).replace(/\{([^|}]+)\|([^}]*)\}/g,(m,a,b)=>b?`<ruby>${a}<rt>${b}</rt></ruby>`:a);
const plain=s=>String(s).replace(/\{([^|}]+)\|([^}]*)\}/g,'$1');
const reading=s=>String(s).replace(/\{([^|}]+)\|([^}]*)\}/g,(m,a,b)=>b||a);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
document.querySelectorAll('.rb').forEach(el=>el.innerHTML=rb(el.innerHTML));

// ---------- data (デモ用の概数) ----------
const CONT={
  asia:{name:'アジア',h:350}, europe:{name:'ヨーロッパ',h:262}, africa:{name:'アフリカ',h:172},
  namerica:{name:'{北|きた}アメリカ',h:24}, samerica:{name:'{南|みなみ}アメリカ',h:128}, oceania:{name:'オセアニア',h:305}
};
const REL={christ:'キリスト{教|きょう}',islam:'イスラム{教|きょう}',buddha:'{仏教|ぶっきょう}',hindu:'ヒンドゥー{教|きょう}',judaism:'ユダヤ{教|きょう}',shinto:'{神道|しんとう}',folk:'{伝統的|でんとうてき}な{宗教|しゅうきょう}など',none:'{無宗教|むしゅうきょう}の{人|ひと}が{多|おお}い'};
const FEAT={star:'{星|ほし}がある',circle:'{丸|まる}がある',moon:'{月|つき}がある',cross:'{十字|じゅうじ}がある',uj:'イギリスの{国旗|こっき}{入|い}り',
  vtri:'{縦|たて}3つに{分|わ}かれている',htri:'{横|よこ}3つに{分|わ}かれている',two:'2{色|しょく}だけ',triangle:'{三角|さんかく}がある',emblem:'{絵|え}や{文字|もじ}が{入|はい}っている'};
const LV_NAME=['まだ','であった','おぼえかけ','おぼえた','ばっちり','マスター'];
const LV_DAYS=[0,1,3,7,14,30];
/*__DATA__*/
const EXTRA=/*__EXTRA__*/{};C.forEach(c=>Object.assign(c,EXTRA[c.code]||{}));
const isRegion=c=>c.kind==='region';
C.forEach(c=>{c.twins=c.twins||[];c.tiny=c.area<6000;c.lang=c.langs.join('・')+(c.langMore?'など':'');c.rel=c.rels.map(r=>REL[r]).join('・')});
const BY={};C.forEach(c=>BY[c.code]=c);
const JP=BY.JP;

// ---------- state ----------
const KEY='kokkikara-demo-v1';
let S={levels:{},due:{},settings:{answer:'voice',speak:true}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)S=Object.assign(S,s)}catch(e){}
S.due=S.due||{};S.settings=Object.assign({mode:'mix',range:'all',count:10},S.settings);C.forEach(c=>{if(S.levels[c.code]==null)S.levels[c.code]=0});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const lv=code=>S.levels[code]||0;

// ---------- formatting ----------
function manFmt(n){ // 数を「万・億」表記に
  if(n>=1e8){const o=Math.floor(n/1e8),m=Math.round((n%1e8)/1e6)*100;return `${o}{億|おく}${m?m+'{万|まん}':''}`}
  if(n>=1e4){const m=Math.floor(n/1e4),r=Math.round((n%1e4)/1000)*1000;return r&&m<10?`${m}{万|まん}${r}`:`${Math.round(n/1e4)}{万|まん}`}
  return String(Math.round(n));
}
function ratioFmt(v,base){
  const r=v/base;
  const big=n=>n>=1e4?`${Math.round(n/1e4)}{万|まん}`:n>=100?String(Math.round(n/100)*100):n>=10?String(Math.round(n)):n.toFixed(1);
  if(r>=1.05)return `{日本|にほん}の{約|やく}${big(r)}{倍|ばい}`;
  if(r<=0.95)return `{日本|にほん}の{約|やく}${big(1/r)}{分|ぶん}の1`;
  return `{日本|にほん}と{同|おな}じくらい`;
}
const popFmt=n=>`{約|やく}${manFmt(n)}{人|にん}`;
const areaFmt=n=>`{約|やく}${manFmt(n)}km²`;
const dots=l=>`<span class="dots">${[1,2,3,4,5].map(i=>`<i style="background:${i<=l?lvColor(BY_CONT_H.cur,i):'#e5e7eb'}"></i>`).join('')}</span>`;
const BY_CONT_H={cur:0};

// ---------- colors ----------
function lvColor(h,l){
  if(l<=0)return '#d7dbe2';
  if(l>=5)return '#f2c230';
  return [null,`hsl(${h},60%,80%)`,`hsl(${h},62%,67%)`,`hsl(${h},66%,54%)`,`hsl(${h},70%,42%)`][l];
}
const colorOf=c=>lvColor(CONT[c.cont].h,lv(c.code));

// ---------- flags ----------
const flagURL={};const flag=code=>flagURL[code]||(flagURL[code]=URL.createObjectURL(new Blob([FLAGS[code]],{type:'image/svg+xml'})));

// ---------- speech ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function say(text,lang='ja-JP'){
  if(!S.settings.speak||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.9;speechSynthesis.speak(u)}catch(e){}
}
function listen(ms=7000){
  return new Promise((resolve,reject)=>{
    if(!SR){reject('unsupported');return}
    let r;try{r=new SR()}catch(e){reject('unsupported');return}
    r.lang='ja-JP';r.interimResults=false;r.maxAlternatives=5;r.continuous=false;
    let done=false;const fin=(v,err)=>{if(done)return;done=true;clearTimeout(t);err?reject(err):resolve(v)};
    r.onresult=e=>{const res=e.results[0];const alts=[];for(let i=0;i<res.length;i++)alts.push(res[i].transcript);fin(alts)};
    r.onerror=e=>fin(null,e.error||'error');
    r.onend=()=>fin([]);
    const t=setTimeout(()=>{try{r.stop()}catch(e){}},ms);

  {const t=targetView(),k=1-Math.pow(.8,dt/16);let d=0;for(const key of ['cx','cy','r']){const v=view[key]+(t[key]-view[key])*k;d+=Math.abs(t[key]-v);view[key]=d<0.3?t[key]:v}if(d>=0.3)dirty=true}

function groupBy(keysOf){const m=new Map();for(const c of C)for(const k of keysOf(c)){if(!m.has(k))m.set(k,[]);m.get(k).push(c)}return m}
function zukanBody(){
  const t=ZK.tab;let h='';

    for(const [k,l] of many)h+=section(k,l);
    if(one.length)h+=section('その{国|くに}だけの{言葉|ことば}',one.map(x=>x[1][0]),c=>one.find(x=>x[1][0]===c)[0]);
  }

    h+=`<div class="note">その{国|くに}でおもに{信|しん}じられている{宗教|しゅうきょう}で{分|わ}けています。2つ{入|はい}っている{国|くに}もあります。</div>`;
    for(const k of Object.keys(REL))if(m.has(k))h+=section(REL[k],m.get(k));
  }
  else if(t==='feat'){

    if(R.note)h+=`<div class="note">${R.note}</div>`;
    const list=C.filter(R.only||(()=>true)).sort((a,b)=>R.desc?R.v(b)-R.v(a):R.v(a)-R.v(b));const max=R.max||Math.max(...list.map(R.v));

function pickSession(pool=C,n=10){ // ふくしゅうの日が来た国 → 新しい国（問題数の半分まで） → おぼえ度が低い国
  const now=Date.now(),learned=pool.filter(c=>lv(c.code)>0),fresh=pool.filter(c=>lv(c.code)===0);
  let list=learned.filter(c=>(S.due[c.code]||0)<=now).sort((a,b)=>(S.due[a.code]||0)-(S.due[b.code]||0)).slice(0,n);
  const nNew=Math.min(Math.round(n/2),n-list.length);list=list.concat(fresh.slice(0,nNew));
  if(list.length<n)list=list.concat(learned.filter(c=>!list.includes(c)).sort((a,b)=>lv(a.code)-lv(b.code)||(S.due[a.code]||0)-(S.due[b.code]||0)).slice(0,n-list.length));
  return shuffle(list);
}

function startStudy(){

async function nextQ(){
  if(Q.i>=Q.queue.length)return endStudy();
  const item=Q.queue[Q.i],c=BY[item.code];item.type=item.type||(Q.mode&&Q.mode!=='mix'?TYPE_OF[Q.mode]:pickType(c));
  if(lv(c.code)===0&&!item.seen){item.seen=true;showIntro(c);return}
  if(item.type==='voice'&&(S.settings.answer!=='voice'||!SR))item.type='name4';
  ({voice:askVoice,name4:askName4,flag4:askFlag4,capital4:askCapital4,locate:askLocate})[item.type](c,item);

function distractors(c,n=3,mode='flag',ok=()=>true){ // 似た国旗 → 同じ大陸 → そのほか の順に選ぶ
  // 見た目がほぼ同じで区別できない組（twins）は同じ問題に入れない
  const tw=(a,b)=>a.twins.includes(b.code)||b.twins.includes(a.code);
  const out=[];const add=x=>{if(x&&x!==c&&ok(x)&&!tw(c,x)&&!out.some(o=>tw(o,x))&&!out.includes(x)&&out.length<n)out.push(x)};
  if(mode==='flag')shuffle(c.similar.map(k=>BY[k])).forEach(add);
  shuffle(C.filter(x=>x.cont===c.cont)).forEach(add);shuffle(C).forEach(add);return out}

  <button class="mic" data-act="mic">${ICON_MIC}</button>

  <div class="qsub"><button data-act="dunno">わからない</button></div>`);
}
async function doMic(){
  const item=Q.queue[Q.i],c=BY[item.code],btn=$('.mic'),qs=$('#qs');if(!btn||btn.classList.contains('on'))return;
  btn.classList.add('on');qs.innerHTML=rb('きいているよ…');
  let alts;try{alts=await listen()}catch(err){
    if(err==='no-speech'||err==='aborted'){alts=[]}else{btn.classList.remove('on');
    qs.innerHTML=rb(err==='not-allowed'||err==='service-not-allowed'?'マイクが{使|つか}えないよ。{設定|せってい}で{許可|きょか}してね（4たくにするよ）':'{音声認識|おんせいにんしき}が{使|つか}えないので 4たくにするよ');
    await sleep(1600);item.type='name4';return askName4(c,item)}}
  btn.classList.remove('on');
  const heard=alts&&alts[0]?alts[0]:'';
  if(alts&&matches(c,alts))return judge(true,c,`「${heard}」ってきこえたよ`);
  const other=alts&&whoSaid(alts);
  if(other)return judge(false,c,`「${heard}」ってきこえたよ`);
  item.tries++;
  if(item.tries>=3){qs.innerHTML=rb(`${heard?`「${heard}」ってきこえたよ。`:''}4たくにするね`);await sleep(1300);item.type='name4';return askName4(c,item)}
  qs.innerHTML=rb(`${heard?`「${heard}」ってきこえたよ。`:'よくきこえなかったよ。'}もう{一回|いっかい}！（あと${3-item.tries}{回|かい}）`);
}
function choiceQ(prompt,top,opts,correctIdx,render){

async function finishLocate(c,ok,tapped){
  locateMode=null;document.body.classList.remove('locating');$('#banner').classList.add('hidden');dirty=true;
  if(!ok&&tapped)toast(`そこは${tapped.name}だよ`);

  $('#quiz').classList.remove('hidden');judge(ok,c,null,true);
}
async function judge(ok,c,heard,silent){
  const item=Q.queue[Q.i];Q.total++;const before=lv(c.code);let after=before;
  if(ok){Q.ok++;after=before>=4?(item.type==='locate'?5:before):Math.min(4,before+1);if(before===4&&item.type!=='locate')after=4;}
  else{after=before===0?0:Math.max(1,before-1);if(!Q.retried.has(c.code)){Q.retried.add(c.code);Q.queue.push({code:c.code,seen:true})}}
  S.levels[c.code]=after;if(after>0)S.due[c.code]=Date.now()+LV_DAYS[after]*864e5;save();renderScore();dirty=true;
  if(after>before)Q.ups.push(c.code);
  if(silent){Q.i++;return nextQ()}
  qShell(`<div class="judge ${ok?'ok':'ng'}">${ok?'せいかい！':'ざんねん'}</div>${heard?`<div class="qstatus">${heard}</div>`:''}
   <img class="qflag" src="${flag(c.code)}" alt="" style="width:min(50vw,320px)"><div class="qname">${c.name}<button class="spk" data-act="say" data-t="${reading(c.name)}">${ICON_SPK}</button></div>
   <div style="font-size:18px;color:#6b7280">おぼえ{度|ど}：${LV_NAME[before]} → <b style="color:#1f2937">${LV_NAME[after]}</b></div>
   <div class="qsub"><button data-act="next" style="background:linear-gradient(135deg,#ff7a59,#ffb347);color:#fff;font-size:20px;padding:14px 40px">つぎへ</button>${ok?'':`<button data-act="qcard" data-c="${c.code}">カードを{見|み}る</button>`}</div>`);
  say(ok?'せいかい！':reading(c.name));
}

   ${Q.ups.length?`<div style="font-size:18px">おぼえ{度|ど}が{上|あ}がった{国|くに}</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">${[...new Set(Q.ups)].map(k=>`<img src="${flag(k)}" style="height:48px;border-radius:6px;border:1px solid #eee">`).join('')}</div>`:''}
   <div class="qsub"><button data-act="toglobe" style="background:linear-gradient(135deg,#ff7a59,#ffb347);color:#fff;font-size:20px;padding:14px 34px">{地球儀|ちきゅうぎ}を{見|み}る</button><button data-act="again">もう{一回|いっかい}</button></div>`);

  if(a==='close')closeModal();
  else if(a==='zukan')openZukan();
  else if(a==='ztab'){ZK.tab=b.dataset.v;openZukan()}
  else if(a==='zrank'){ZK.rank=b.dataset.v;openZukan(true)}
  else if(a==='study')openStudyMenu();
  else if(a==='smode'){S.settings.mode=b.dataset.v;save();openStudyMenu()}
  else if(a==='srange'){S.settings.range=b.dataset.v;save();const sc=$('#modal .panel').scrollTop;openStudyMenu();$('#modal .panel').scrollTop=sc}
  else if(a==='scount'){S.settings.count=+b.dataset.v;save();const sc=$('#modal .panel').scrollTop;openStudyMenu();$('#modal .panel').scrollTop=sc}
  else if(a==='sgo'||a==='again')startStudy();
  else if(a==='speedtap'){if(Q.shown){Q.shown=false;Q.i++}else Q.shown=true;speedShow()}
  else if(a==='settings')openSettings();
  else if(a==='card'){const c=BY[b.dataset.c];const back=modalKind==='zukan'?$('#modal .panel').scrollTop:null;openCard(c);cardBack=back}
  else if(a==='say')say(b.dataset.t);
  else if(a==='sayx')say(b.dataset.t,b.dataset.l);
  else if(a==='set'){let v=b.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;S.settings[b.dataset.k]=v;save();openSettings();$('#modal .panel').scrollTop=0}
  else if(a==='setlv'){S.levels[b.dataset.c]=+b.dataset.v;save();renderScore();dirty=true;const sc=$('#modal .panel').scrollTop;openSettings();$('#modal .panel').scrollTop=sc}
  else if(a==='allmaster'){C.forEach(c=>S.levels[c.code]=5);save();renderScore();dirty=true;closeModal();toast('ぜんぶマスターにしたよ')}
  else if(a==='reset'){if(!confirmReset(b))return;C.forEach(c=>S.levels[c.code]=0);save();renderScore();dirty=true;closeModal();toast('リセットしたよ')}
  else if(a==='srtest'){const o=$('#srout');o.innerHTML=rb('きいているよ…');try{const alts=await listen();
      if(!alts||!alts.length){o.innerHTML=rb('{聞|き}き{取|と}れなかったよ');return}
      const w=whoSaid(alts);o.innerHTML=rb(`{候補|こうほ}：${alts.map(s=>`「${s}」`).join(' ')}<br>{判定|はんてい}：${w?w.name:'50か{国|こく}には{当|あ}てはまらない'}`)}
    catch(err){o.innerHTML=rb(`{使|つか}えませんでした（${err}）`)}}
  else if(a==='mic')doMic();
  else if(a==='dunno'){const c=BY[Q.queue[Q.i].code];judge(false,c)}
  else if(a==='pick')onPick(+b.dataset.i);
  else if(a==='next'){Q.i++;nextQ()}
  else if(a==='introok'){nextQ()}
  else if(a==='qcard'){openCard(BY[b.dataset.c])}
  else if(a==='quit'){Q=null;$('#quiz').classList.add('hidden');dirty=true}
  else if(a==='toglobe')toGlobe();
  else if(a==='locdunno'){const c=BY[Q.queue[Q.i].code];finishLocate(c,false,null)}
});
function confirmReset(b){if(b.dataset.armed){return true}b.dataset.armed='1';b.innerHTML=rb('もう{一度|いちど}おすとリセット');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.innerHTML='ぜんぶリセット'}},3000);return false}

// ---------- start ----------
resize();renderScore();requestAnimationFrame(loop);
</script>
</body>
</html>
